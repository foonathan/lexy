name: Main CI

on:
  push:
    branches: [main, fix/*]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        image:
          - "gcc:7"
          - "gcc:8"
          - "gcc:9"
          - "gcc:10"
          - "gcc:11"
          - "gcc:12"
          - "gcc:13"
          - "gcc:14"
          - "clang:6"
          - "clang:7"
          - "clang:8"
          - "clang:9"
          - "clang:10"
          - "clang:11"
          - "clang:12"
          - "clang:13"
          - "clang:14"
          - "clang:15"
          - "clang:16"
          - "clang:17"
          - "clang:18"
        build_type: [Debug, Release]

    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/foonathan/${{matrix.image}}

    steps:
    - uses: actions/checkout@v7
    - name: Create Build Environment
      run: cmake -E make_directory build

    - name: Configure
      working-directory: build/
      run: cmake -GNinja $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
    - name: Build
      working-directory: build/
      run: cmake --build .
    - name: Test
      working-directory: build/
      run: ctest --output-on-failure

  linux-current:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-15, clang++-22]
        cpp17: [ON, OFF]
        build_type: [Debug, Release]

    runs-on: ubuntu-26.04
    env:
      CXX: ${{matrix.cxx}}

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DLEXY_FORCE_CPP17=${{matrix.cpp17}}
    - name: Build
      run: cmake --build build --parallel 2
    - name: Test
      run: ctest --test-dir build --output-on-failure

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - {os: macos-15, xcode: '16.4'}
          - {os: macos-26, xcode: '26.6'}
        build_type: [Debug, Release]

    runs-on: ${{matrix.runner.os}}

    steps:
    - uses: actions/checkout@v7
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{matrix.runner.xcode}}
    - name: Create Build Environment
      run: cmake -E make_directory build

    - name: Configure
      working-directory: build/
      run: cmake -GNinja $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
    - name: Build
      working-directory: build/
      run: cmake --build .
    - name: Test
      working-directory: build/
      run: ctest --output-on-failure

  windows:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - {os: windows-2022, generator: 'Visual Studio 17 2022', toolset: v142}
          - {os: windows-2022, generator: 'Visual Studio 17 2022', toolset: v143}
          - {os: windows-2025-vs2026, generator: 'Visual Studio 18 2026', toolset: ClangCL}
        build_type: [Debug, Release]
        arch: [Win32, x64]

    runs-on: ${{matrix.toolchain.os}}

    steps:
    - uses: actions/checkout@v7
    - name: Create Build Environment
      run: cmake -E make_directory build

    - name: Configure
      shell: bash
      working-directory: build/
      run: cmake $GITHUB_WORKSPACE -G"${{matrix.toolchain.generator}}" -T ${{matrix.toolchain.toolset}} -A ${{matrix.arch}}
    - name: Build
      working-directory: build/
      run: cmake --build . --config ${{matrix.build_type}} -j 2
    - name: Test
      working-directory: build/
      run: ctest -C ${{matrix.build_type}} --output-on-failure

