name: Sanitizers

on:
  push:
    branches: '**'
  pull_request:

jobs:
  sanitizers:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Create Build Environment
      run: cmake -E make_directory build
    - name: Configure
      working-directory: build/
      run: cmake -GNinja "$GITHUB_WORKSPACE" -DCMAKE_CXX_COMPILER=g++-15 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-DLEXY_DISABLE_CONSTEXPR_TESTS -fsanitize=address,undefined,leak -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,leak"
    - name: Build
      working-directory: build/
      run: cmake --build .
    - name: Test
      working-directory: build/
      run: ctest --output-on-failure
      env:
        ASAN_OPTIONS: detect_stack_use_after_return=1

  clang-tidy:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Create Build Environment
      run: cmake -E make_directory build
    - name: Configure
      working-directory: build/
      run: cmake -GNinja "$GITHUB_WORKSPACE" -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_CXX_CLANG_TIDY=clang-tidy-22
    - name: Build
      working-directory: build/
      run: cmake --build . --target lexy_test lexy_ext_test

  benchmarks: # just to ensure that they are compiled
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Create Build Environment
      run: cmake -E make_directory build

    - name: Configure
      working-directory: build/
      run: cmake -GNinja "$GITHUB_WORKSPACE" -DCMAKE_CXX_COMPILER=g++-15 -DLEXY_BUILD_BENCHMARKS=ON -DLEXY_BUILD_EXAMPLES=OFF -DLEXY_BUILD_TESTS=OFF
    - name: Build
      working-directory: build/
      run: cmake --build .

